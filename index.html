<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Labirinto delle Parole 🚀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stile.css">
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="hudBox" id="hudLevel">🚀</div>
  <div class="hudBox" id="hudLives">❤️❤️❤️</div>
  <div class="hudBox" id="hudKeys">🗝️ 0/5</div>
  <div class="hudBox" id="hudScore">⭐ 0</div>
  <div class="hudBox" id="hudCombo">🔥 x2</div>
  <div id="hudBtns"><button class="hudBtn" id="btnCam" title="Visuale">🎥</button><button class="hudBtn" id="btnMusicHud" title="Musica">🎵</button><button class="hudBtn" id="btnHome" title="Menu">🏠</button></div>
</div>

<div id="comboBig"></div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="startHint"></div>

<!-- MENU -->
<div class="overlay" id="menu" style="display:flex">
  <div class="card mapCard">
    <div id="menuTitle">🌟 Il Labirinto delle Parole 🌟</div>
    <div id="menuSub"></div>
    <div class="togRow">
      <button class="togBtn" id="btnDiff">⭐ Facile</button>
      <button class="togBtn" id="btnVoice">🔊 Voce: sì</button>
      <button class="togBtn" id="btnMusic">🎵 Musica: sì</button>
      <button class="togBtn" id="btnArrow">🧭 Freccia: sì</button>
      <button class="togBtn" id="btnAlbum">📖 Parole</button>
      <button class="togBtn" id="btnReset">🔄 Azzera progressi</button>
    </div>
    <div id="statRow"></div>
    <div id="mapWrap"></div>
    <div id="howto"></div>
    <div id="ttsStatus"></div>
    <div id="ttsBar"><div id="ttsBarFill"></div></div>
  </div>
</div>

<!-- NAME -->
<div class="overlay" id="nameOv" style="z-index:20">
  <div class="card">
    <div style="font-size:50px;margin-bottom:6px">👋</div>
    <div id="nameTitle" style="font-size:clamp(26px,5vw,38px);color:#2b3a8f;margin-bottom:14px">CIAO! COME TI CHIAMI?</div>
    <input id="nameInput" maxlength="14" autocomplete="off" style="width:min(320px,90%);font-family:inherit;font-size:28px;text-align:center;padding:10px 14px;border:3px solid #c5cffb;border-radius:16px;text-transform:uppercase;outline:none">
    <br>
    <button id="nameGo" class="togBtn" style="margin-top:16px;font-size:24px;padding:12px 30px;background:#3cba54;color:#fff;border-color:#2f9443">GIOCA! 🚀</button>
  </div>
</div>

<!-- QUESTION -->
<div class="overlay" id="question">
  <div class="card">
    <div id="qEmoji">🚪</div>
    <div id="qTheme"></div>
    <div id="qLives">❤️❤️❤️</div>
    <div id="qText"></div>
    <div id="jollyBar">
      <button id="qSpeak" class="jollyBtn">🔊</button>
      <button id="j5050" class="jollyBtn">🎯</button>
    </div>
    <div id="readAloneHint"></div>
    <div id="answers"></div>
    <div id="qMsg"></div>
    <div id="qExplain">
      <div id="qExpText"></div>
      <div id="bqBox">
        <div id="bqTitle"></div>
        <div id="bqText"></div>
        <div id="bqAnswers"></div>
        <div id="bqMsg"></div>
      </div>
      <button id="qExpSpeak">🔊</button>
      <a id="qExpLink" href="#" target="_blank" rel="noopener"></a>
      <button id="qExpNext">➡️</button>
    </div>
    <button id="qBack">torna indietro</button>
  </div>
</div>

<!-- WIN -->
<div class="overlay" id="win">
  <div class="card">
    <div id="winEmoji">🏆</div>
    <div id="winTitle"></div>
    <div id="winStars" class="starRow"></div>
    <div id="winText"></div>
    <button class="bigBtn" id="winNext">➡️</button>
  </div>
</div>

<!-- BOSS -->
<div class="overlay" id="boss">
  <div class="card">
    <div id="bossFace">🐲</div>
    <div id="bossName"></div>
    <div id="bossBars">
      <div id="bossHp"><span class="lab"></span><span id="bossHpHearts"></span></div>
      <div id="bossPl"><span class="lab"></span><span id="bossPlHearts"></span></div>
    </div>
    <div id="bossPlay">
      <div id="bossTimer"><div id="bossTimerFill"></div></div>
      <div id="bossText"></div>
      <div id="bossQ"></div>
      <button id="bossRead">🔊</button>
      <div id="bossAnswers"></div>
      <div id="bossMsg"></div>
    </div>
    <div id="bossOver" style="display:none">
      <div id="bossOverText"></div>
      <button class="bigBtn" id="bossRetry"></button>
      <button id="bossFlee"></button>
    </div>
  </div>
</div>

<!-- ALBUM PAROLE -->
<div class="overlay" id="album">
  <div class="card">
    <div id="albumTitle"></div>
    <div id="albumCount"></div>
    <div id="wordList"></div>
    <button class="bigBtn" id="albumCloseBtn" style="margin-top:16px"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/domande.js"></script>
<script src="js/sfide.js"></script>
<script src="js/testi.js"></script>
<script src="js/audio-voce.js"></script>
<script src="js/labirinto-3d.js"></script>
<script src="js/gioco-labirinto.js"></script>
<script src="js/alveare.js"></script>
</body>
</html>
